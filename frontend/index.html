<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>
      Trường Thành Stationery - Hệ Thống Bán Lẻ Văn Phòng Phẩm Chính Hãng
    </title>
    <meta
      name="description"
      content="Chuyên cung cấp dụng cụ học tập, viết bi, tập vở học sinh và thiết bị văn phòng chất lượng cao tại Việt Nam. Cam kết chính hãng 100%, đổi trả linh hoạt."
    />
    <meta name="author" content="Trường Thành Stationery" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#dc2626" />

    <!-- SEO-TASK-001: KHÔNG đặt canonical/og:url tĩnh ở đây (mọi route SPA dùng chung file này).
         Canonical, og:url được useSeoMeta đặt theo từng trang. -->
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Trường Thành Stationery - Hệ Thống Bán Lẻ Văn Phòng Phẩm Chính Hãng" />
    <meta property="og:description" content="Chuyên cung cấp dụng cụ học tập, viết bi, tập vở học sinh và thiết bị văn phòng chất lượng cao tại Việt Nam. Cam kết chính hãng 100%." />
    <meta property="og:image" content="https://truong-thanh-bookstore.vercel.app/logo.jpg" />
    <meta property="og:site_name" content="Trường Thành Stationery" />
    <meta property="og:locale" content="vi_VN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trường Thành Stationery - Hệ Thống Bán Lẻ Văn Phòng Phẩm Chính Hãng" />
    <meta name="twitter:description" content="Chuyên cung cấp dụng cụ học tập, viết bi, tập vở học sinh và thiết bị văn phòng chất lượng cao tại Việt Nam." />
    <meta name="twitter:image" content="https://truong-thanh-bookstore.vercel.app/logo.jpg" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;750;850&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        const lang = localStorage.getItem('lang') || 'vi';
        document.documentElement.setAttribute('lang', lang);
      })();
    </script>
  </head>
  <body>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: sans-serif;">
        <h1>Trường Thành Stationery</h1>
        <p>Vui lòng bật JavaScript để sử dụng website.</p>
      </div>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
