services:
  # -------------------------------------------------------------
  # MongoDB Database Service
  # -------------------------------------------------------------
  mongodb:
    image: mongo:7.0-jammy
    container_name: truongthanh-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: truong_thanh_bookstore
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - truongthanh-network

  # -------------------------------------------------------------
  # Backend API Service (NestJS)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: truongthanh-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/truong_thanh_bookstore?replicaSet=rs0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      AUTO_SEED: "false"
      RESET_DATABASE_ON_SEED: "false"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - truongthanh-network

  # -------------------------------------------------------------
  # Frontend Web Store & Admin CMS (Vue 3 + Nginx)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: truongthanh-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - truongthanh-network

  # -------------------------------------------------------------
  # Database Management GUI (Mongo Express - Optional)
  # -------------------------------------------------------------
  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: truongthanh-mongo-express
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME:?Mongo Express username is required}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD:?Mongo Express password is required}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - truongthanh-network

volumes:
  mongodb_data:
    driver: local

networks:
  truongthanh-network:
    driver: bridge
