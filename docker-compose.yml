services:
  # -------------------------------------------------------------
  # MongoDB Database Service
  # -------------------------------------------------------------
  mongodb:
    image: mongo:7.0-jammy
    container_name: truongthanh-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: truong_thanh_bookstore
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - truongthanh-network

  # -------------------------------------------------------------
  # Backend API Service (NestJS)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: truongthanh-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/truong_thanh_bookstore
      JWT_SECRET: TruongThanhProductionSecretKey2026!SecureAuth
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:80,http://localhost:5173,http://localhost
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - truongthanh-network

  # -------------------------------------------------------------
  # Frontend Web Store & Admin CMS (Vue 3 + Nginx)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: truongthanh-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - truongthanh-network

  # -------------------------------------------------------------
  # Database Management GUI (Mongo Express - Optional)
  # -------------------------------------------------------------
  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: truongthanh-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: TruongThanhAdmin2026!
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - truongthanh-network

volumes:
  mongodb_data:
    driver: local

networks:
  truongthanh-network:
    driver: bridge
