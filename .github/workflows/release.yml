name: Release & Changelog Automation

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  verify-release:
    name: Verify tagged source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Start MongoDB replica set for E2E
        run: |
          docker run --detach --name truongthanh-e2e-mongodb --publish 27017:27017 mongo:7.0-jammy mongod --replSet rs0 --bind_ip_all
          until docker exec truongthanh-e2e-mongodb mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1; do sleep 2; done
          docker exec truongthanh-e2e-mongodb mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          until docker exec truongthanh-e2e-mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; do sleep 2; done

      - name: Verify backend
        working-directory: backend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm test -- --runInBand
          npx jest --rootDir . test/all-fixes.spec.ts test/e2e-flow.spec.ts test/critical-commerce-regression.spec.ts --runInBand --detectOpenHandles
          npm run test:e2e -- --runInBand --detectOpenHandles
          npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/truongthanh_e2e?replicaSet=rs0&directConnection=true
          JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
          JWT_REFRESH_SECRET: ci-only-jwt-refresh-secret-at-least-32-chars
          JWT_RESET_SECRET: ci-only-jwt-reset-secret-at-least-32-chars

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run test:unit
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify mobile
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test

  create-release:
    needs: verify-release
    name: 🏷️ Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📝 Generate Release Notes
        id: release_notes
        run: |
          echo "## Trường Thành Bookstore — Release ${{ github.ref_name }}" > release_notes.md
          echo "Hệ thống thương mại điện tử đa kênh Sách & Văn phòng phẩm." >> release_notes.md
          echo "" >> release_notes.md
          echo "### 🌟 Các tính năng nổi bật:" >> release_notes.md
          echo "- **Backend NestJS**: Microservices-ready modular architecture, JWT rotation, Rate limiting, Atomic Stock, PDF Invoices, WebSocket alerts." >> release_notes.md
          echo "- **Frontend Web Vue 3**: Storefront, Admin CMS, Live Suggestions, Freeship 299K progress bar, Verified reviews." >> release_notes.md
          echo "- **Mobile Flutter App**: Multi-platform sync, Wishlist, Notifications, Address book, Shimmer skeletons, Offline resilience." >> release_notes.md
          echo "- **DevOps & QA**: Automated regression tests, Docker Compose orchestration, GitHub Actions CI/CD." >> release_notes.md

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          draft: false
          prerelease: false
