name: CD Deploy

on:
  workflow_run:
    workflows: ["CI Pipeline — Trường Thành Bookstore"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Backend to Render
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Check secret existence
        id: check-secret
        run: |
          test -n "${{ secrets.RENDER_DEPLOY_HOOK }}" || { echo "RENDER_DEPLOY_HOOK is required"; exit 1; }

      - name: Checkout Code for Smoke Testing
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Trigger Render Deploy Hook
        run: |
          curl --fail --show-error --silent -X GET "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: 🩺 Run Automated Smoke Test
        run: |
          chmod +x ./scripts/smoke-test.sh
          MAX_ATTEMPTS=60 WAIT_SECONDS=10 ./scripts/smoke-test.sh "${{ secrets.BACKEND_PRODUCTION_URL || 'https://truongthanh-backend.onrender.com' }}" "${{ github.event.workflow_run.head_sha }}"

  deploy-frontend:
    name: Deploy Frontend to Vercel
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Vercel Token existence
        id: check-token
        run: |
          test -n "${{ secrets.VERCEL_TOKEN }}" || { echo "VERCEL_TOKEN is required"; exit 1; }
          test -n "${{ secrets.VERCEL_ORG_ID }}" || { echo "VERCEL_ORG_ID is required"; exit 1; }
          test -n "${{ secrets.VERCEL_PROJECT_ID }}" || { echo "VERCEL_PROJECT_ID is required"; exit 1; }

      - name: Install Vercel CLI
        run: npm install --global vercel@33

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=${DEPLOYMENT_URL}" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Smoke Test Frontend Deployment
        run: curl --fail --show-error --silent --retry 12 --retry-all-errors --retry-delay 5 "${{ steps.deploy.outputs.url }}" > /dev/null
