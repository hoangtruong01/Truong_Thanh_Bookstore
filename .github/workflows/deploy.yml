name: CD Deploy

on:
  workflow_run:
    workflows: ["CI Pipeline — Trường Thành Bookstore"]
    types:
      - completed
    branches:
      - main

# SEC-031: quyền tối thiểu cho GITHUB_TOKEN (deploy dùng secrets riêng, không cần ghi repo)
permissions:
  contents: read

jobs:
  deploy-backend:
    name: Deploy Backend to Render
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code for Smoke Testing
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # TASK-004: Render does not rebuild for commits that leave backend/ untouched,
      # so the last commit that changed backend/ is also an acceptable live release.
      - name: Resolve acceptable backend releases
        id: release
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          BACKEND_SHA=$(git log -1 --format=%H "$HEAD_SHA" -- backend)
          echo "expected=${HEAD_SHA},${BACKEND_SHA}" >> "$GITHUB_OUTPUT"
          echo "Accepting backend release ${HEAD_SHA} or ${BACKEND_SHA}"

      - name: Trigger Render Deploy Hook (if configured)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Triggering Render deployment webhook..."
            curl --fail --show-error --silent -X GET "$RENDER_DEPLOY_HOOK"
          else
            echo "RENDER_DEPLOY_HOOK secret not provided. Backend is auto-deployed via Render Git Integration."
          fi

      - name: 🩺 Run Automated Smoke Test
        env:
          BACKEND_URL: ${{ secrets.BACKEND_PRODUCTION_URL || 'https://truong-thanh-bookstore.onrender.com' }}
          EXPECTED_RELEASES: ${{ steps.release.outputs.expected }}
        run: |
          chmod +x ./scripts/smoke-test.sh
          MAX_ATTEMPTS=60 WAIT_SECONDS=10 ./scripts/smoke-test.sh "$BACKEND_URL" "$EXPECTED_RELEASES"

  deploy-frontend:
    name: Deploy Frontend to Vercel
    # TASK-004 (BUG-002): never ship a frontend whose backend failed to go live.
    needs: deploy-backend
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Vercel (CLI or Git Integration fallback)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "Deploying via Vercel CLI..."
            npm install --global vercel@33
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            vercel build --prod --token="$VERCEL_TOKEN"
            DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")
            echo "url=${DEPLOYMENT_URL}" >> "$GITHUB_OUTPUT"
          else
            echo "Vercel Secrets not configured. Production is deployed automatically via Vercel Git Integration."
            echo "url=https://truong-thanh-bookstore.vercel.app" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke Test Frontend Deployment
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: curl --fail --show-error --silent --retry 12 --retry-all-errors --retry-delay 5 "$DEPLOY_URL" > /dev/null
