name: CI Pipeline — Trường Thành Bookstore

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-ci:
    name: 🚀 Backend CI (NestJS + Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Lint & Code Style Check
        run: npm run lint || true

      - name: 🧪 Run Unit & Integration Tests
        run: |
          npm test
          npx jest --rootDir . test/all-fixes.spec.ts
          npx jest --rootDir . test/e2e-flow.spec.ts

      - name: 🏗️ Build Backend Production Bundle
        run: npm run build

  frontend-ci:
    name: 🌐 Frontend CI (Vue 3 + Vite + TypeCheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Type Check & Build Production Bundle
        run: npm run build

  mobile-ci:
    name: 📱 Mobile CI (Flutter + Dart Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 💙 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 💙 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: 📦 Get Flutter Packages
        run: flutter pub get

      - name: 🔍 Analyze Dart Code
        run: flutter analyze || true

      - name: 🧪 Run Flutter Unit & Widget Tests
        run: flutter test
