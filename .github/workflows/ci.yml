name: CI Pipeline — Trường Thành Bookstore

on:
  push:
    branches: [ main, master, develop, dev ]
  pull_request:
    branches: [ main, master, develop, dev ]

jobs:
  backend-ci:
    name: 🚀 Backend CI (NestJS + Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛡️ Security Audit
        run: npm audit --audit-level=high

      - name: 🔍 Lint & Code Style Check
        run: npm run lint

      - name: Start MongoDB replica set for E2E
        run: |
          docker run --detach --name truongthanh-e2e-mongodb --publish 27017:27017 mongo:7.0-jammy mongod --replSet rs0 --bind_ip_all --setParameter maxTransactionLockRequestTimeoutMillis=5000
          until docker exec truongthanh-e2e-mongodb mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1; do sleep 2; done
          docker exec truongthanh-e2e-mongodb mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          until docker exec truongthanh-e2e-mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; do sleep 2; done

      - name: 🧪 Run Unit & Integration Tests
        run: |
          npm test -- --runInBand
          npx jest --rootDir . test/all-fixes.spec.ts test/e2e-flow.spec.ts test/critical-commerce-regression.spec.ts --runInBand --detectOpenHandles
          npm run test:e2e -- --runInBand --detectOpenHandles
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/truongthanh_e2e?replicaSet=rs0&directConnection=true
          JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
          JWT_REFRESH_SECRET: ci-only-jwt-refresh-secret-at-least-32-chars
          JWT_RESET_SECRET: ci-only-jwt-reset-secret-at-least-32-chars

      - name: 🏗️ Build Backend Production Bundle
        run: npm run build

  frontend-ci:
    name: 🌐 Frontend CI (Vue 3 + Vite + TypeCheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛡️ Security Audit
        run: npm audit --audit-level=high

      - name: 🧪 Run Frontend Unit Tests
        run: npm run test:unit

      - name: 🏗️ Type Check & Build Production Bundle
        run: npm run build

  mobile-ci:
    name: 📱 Mobile CI (Flutter + Dart Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 💙 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 💙 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Get Flutter Packages
        run: flutter pub get

      - name: 🔍 Analyze Dart Code
        run: flutter analyze

      - name: 🧪 Run Flutter Unit & Widget Tests
        run: flutter test
